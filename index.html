<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONNECTD Event Tracker</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--hold:#f3dfb2;--bg:#f5f5f2;--card:#fff;--text:#151515;--muted:#6c6c66;--line:#deded8;--soft:#ecece7;--fill:#151515;--on-fill:#fff;--stat:#fafaf8;--input:#fff;--danger:#a3281f;--ok:#2f6b3a;--warn:#8a5a00;--pend-bg:#151515;--pend-fg:#efefeb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--card:#1b1b19;--text:#ededea;--muted:#a09f98;--line:#2f2f2c;--soft:#2a2a27;--fill:#ededea;--on-fill:#151515;--stat:#222220;--input:#161615;--danger:#ef8a82;--ok:#8fcf99;--warn:#e7b85c;--pend-bg:#ededea;--pend-fg:#1b1b19;--hold:#5c4819}}
:root[data-theme="dark"]{--bg:#121211;--card:#1b1b19;--text:#ededea;--muted:#a09f98;--line:#2f2f2c;--soft:#2a2a27;--fill:#ededea;--on-fill:#151515;--stat:#222220;--input:#161615;--danger:#ef8a82;--ok:#8fcf99;--warn:#e7b85c;--pend-bg:#ededea;--pend-fg:#1b1b19;--hold:#5c4819}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,Arial,Helvetica,sans-serif;font-size:15px;line-height:1.45}
.page{width:min(1180px,calc(100% - 32px));margin:28px auto 56px}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:20px}
.kicker{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:6px}
h1{font-size:42px;margin:0;line-height:1.05;letter-spacing:-1.4px;font-weight:800}
.meta{font-size:13px;color:var(--muted);text-align:right}
.sync{display:inline-flex;align-items:center;gap:6px;margin-top:4px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)}.sync.err i{background:var(--danger)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.tab{flex:none;font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--text)}
.tab[aria-current="true"]{background:var(--fill);color:var(--on-fill)}
.section{margin-top:28px}
.section>h2,.sec-head h2{font-size:21px;margin:0 0 14px;letter-spacing:-.3px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head p{margin:0 0 14px;color:var(--muted);font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0}
.card h3{font-size:16px;margin:0 0 12px}
.status{display:inline-block;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--text)}
.metric{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:8px;line-height:1.1}
.metric-label{color:var(--muted);font-size:13px;line-height:1.45;margin-top:5px}
.metric-label b{color:var(--text)}
.progress-row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}
.progress-title{font-size:16px;font-weight:700}.progress-num{font-size:14px;font-weight:700;text-align:right}
.track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:12px}
.fill{height:100%;background:var(--fill);border-radius:99px;min-width:0}
.fill.min{min-width:10px}
.names{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--stat)}
.tier{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.tier:last-child{border-bottom:0}.tier-name{font-size:15px;font-weight:700}.tier-price{font-size:12px;color:var(--muted);margin-top:4px}
.tier-sold{text-align:right;font-size:21px;font-weight:800;white-space:nowrap}.tier-sold span{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:3px}
.profile-stat{background:var(--stat);border-radius:14px;padding:16px}.profile-stat strong{display:block;font-size:28px;line-height:1.15}.profile-stat span{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:4px}
.islands{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.islands .profile-stat{text-align:center}
.islands .full{outline:2px solid var(--fill);outline-offset:-2px}
.mini-list{list-style:none;padding:0;margin:0}.mini-list li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.mini-list li:last-child{border-bottom:0}
.list-head{font-size:13px;font-weight:700;margin:14px 0 2px;color:var(--muted)}
.list-head:first-child{margin-top:0}
.pie-wrap{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;margin-top:6px}.pie-wrap svg{flex:0 0 170px;width:170px;height:170px}.pie-wrap .mini-list{flex:1 1 220px}.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}.mini-list .pc,.b-v .pc{color:var(--muted);font-weight:500;margin-left:6px}.profile-stat strong .pc{display:inline;font-size:15px;color:var(--muted);font-weight:600;margin-left:8px}
.notes{margin:0;padding-left:20px}.notes li{margin:10px 0;line-height:1.55}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);vertical-align:1px;margin-right:6px}
.pill.Completed{color:var(--ok)}.pill.Blocked{color:var(--danger)}.pill.Waiting{color:var(--warn)}
.pending{background:var(--pend-bg);color:var(--pend-fg);border-radius:18px;padding:22px}.pending h2{margin:0 0 10px;font-size:20px}.pending ol{margin:0;padding-left:22px}.pending li{margin:8px 0;line-height:1.45}
.smallstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.empty button{margin-left:6px}
.agenda-day{font-weight:700;font-size:13px;margin:12px 0 4px}
.agenda-day:first-child{margin-top:0}
.agenda li span:first-child{color:var(--muted);min-width:92px}
.agenda li .pill{margin-right:0;align-self:flex-start;white-space:nowrap}
.days-bar{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.day-card{margin-bottom:14px}
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1.5px solid var(--text)}
.day-title{font-size:19px;font-weight:800;letter-spacing:-.3px}
.agenda-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:28px}
.agenda-col .agenda-day{margin:0 0 6px;padding-bottom:8px;border-bottom:1.5px solid var(--text)}
@media(max-width:480px){.days-bar{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.day-card{margin-bottom:14px}
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1.5px solid var(--text)}
.day-title{font-size:19px;font-weight:800;letter-spacing:-.3px}
.agenda-cols{grid-template-columns:1fr}}
.countdown{margin-top:24px;background:var(--fill);color:var(--on-fill);border-radius:22px;padding:26px 28px;display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center}
.cd-num{font-size:96px;font-weight:800;letter-spacing:-4px;line-height:.9;font-variant-numeric:tabular-nums}
.cd-unit{font-size:16px;font-weight:700;margin-top:8px}
.cd-info{border-left:1px solid color-mix(in srgb,var(--on-fill) 25%,transparent);padding-left:28px;min-width:0}
.cd-title{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.cd-meta{font-size:14px;opacity:.75;margin-top:6px;line-height:1.5}
.cd-stats{display:flex;gap:10px}
.cd-stat{background:color-mix(in srgb,var(--on-fill) 10%,transparent);border-radius:14px;padding:12px 16px;min-width:104px}
.cd-stat strong{display:block;font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.cd-stat span{display:block;font-size:12px;opacity:.75;margin-top:3px}
.countdown .btn{background:var(--on-fill);color:var(--fill);border-color:var(--on-fill)}
@media(max-width:850px){.countdown{grid-template-columns:1fr;gap:18px}.cd-info{border-left:0;padding-left:0}.cd-num{font-size:72px}}
@media(max-width:480px){.cd-stats{flex-wrap:wrap}.cd-stat{flex:1}}
.floor-wrap{overflow-x:auto;margin:0 -6px 6px;padding:0 6px}
.floor{display:block;width:100%;min-width:760px;height:auto}
.floor .hall{fill:var(--stat);stroke:var(--line);stroke-width:2}
.floor .zone{fill:var(--card);stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 4}
.floor .zone-t{fill:var(--muted);font-size:12px;font-weight:700;text-anchor:middle}
.floor .hall-t{fill:var(--muted);font-size:14px;font-weight:700;text-anchor:middle}
.floor .isl-t{fill:var(--muted);font-size:12px;font-weight:700}
.floor .arrow{fill:var(--danger)}
.floor .booth{cursor:pointer}
.floor .booth rect{stroke:var(--card);stroke-width:2;transition:opacity .12s}
.floor .booth text{font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.floor .booth.av rect{fill:var(--card);stroke:var(--muted);stroke-width:1.2}
.floor .booth.av text{fill:var(--text)}
.floor .booth.sec rect{fill:var(--fill)}
.floor .booth.sec text{fill:var(--on-fill)}
.floor .booth.hold rect{fill:var(--hold);stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 3}
.floor .booth.hold text{fill:var(--text)}
.floor .booth.na rect{fill:url(#hatch);stroke:var(--line);stroke-width:1.2}
.floor .booth.na text{fill:var(--muted)}
.floor .booth.org rect{fill:var(--soft);stroke:var(--muted);stroke-width:1.2}
.floor .booth.org text{fill:var(--text)}
.legend .org{background:var(--soft)}
.boothtip .st.org i{background:var(--soft)}
.floor .booth:hover rect,.floor .booth:focus rect,.floor .booth.on rect{stroke:var(--danger);stroke-width:3;stroke-dasharray:none}
.floor .booth:focus{outline:none}
.floor.dim .booth:not(.on) rect{opacity:.35}
.floor .grp{stroke-width:1.5}
.floor .grp.sec{fill:var(--fill);stroke:var(--fill)}
.floor .grp.hold{fill:var(--hold);stroke:var(--warn);stroke-dasharray:5 3}
.floor .booth.gcell rect{fill:transparent;stroke:none}
.floor .booth.gcell:hover rect,.floor .booth.gcell:focus rect,.floor .booth.gcell.on rect{stroke:var(--danger);stroke-width:2.5;stroke-dasharray:none}
.floor .booth .bid{font-size:8.5px;font-weight:700;text-anchor:start;dominant-baseline:hanging;opacity:.7}
.floor .booth.sec .bid{fill:var(--on-fill)}.floor .booth.hold .bid{fill:var(--text)}
.floor .gname{font-weight:800;text-anchor:middle;pointer-events:none}
.floor .gname.sec{fill:var(--on-fill)}.floor .gname.hold{fill:var(--text)}
.st-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;border:1px solid var(--muted)}
.st-dot.sec{background:var(--fill);border-color:var(--fill)}.st-dot.hold{background:var(--hold);border:1px dashed var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin:4px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:16px;height:16px;border-radius:4px;display:inline-block;border:1.2px solid var(--muted)}
.legend .sec{background:var(--fill);border-color:var(--fill)}.legend .av{background:var(--card)}
.legend .hold{background:var(--hold);border:1.5px dashed var(--warn)}
.legend .na{background:repeating-linear-gradient(45deg,var(--line) 0 2px,var(--stat) 2px 6px);border-color:var(--line)}
.legend b{color:var(--text)}
.boothtip{position:fixed;z-index:20;pointer-events:none;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:250px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:13px;line-height:1.45;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.boothtip.show{opacity:1;transform:none}
.boothtip .bt-id{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1}
.boothtip .bt-cat{color:var(--muted);margin:4px 0 10px}
.boothtip dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.boothtip dt{color:var(--muted)}.boothtip dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.boothtip .st{display:inline-flex;align-items:center;gap:6px}
.boothtip .st i{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid var(--muted)}
.boothtip .st.sec i{background:var(--fill);border-color:var(--fill)}.boothtip .st.hold i{background:var(--hold);border:1px dashed var(--warn)}.boothtip .st.na i{background:var(--line)}
@media (prefers-reduced-motion:reduce){.boothtip,.floor .booth rect{transition:none}}
body.sales .header,body.sales nav.tabs{display:none}
body.contractor #banner{display:none}
.s-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin-top:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.c-tbl{min-width:0}.c-tbl td{padding:9px 6px;border-top:1px solid var(--line);font-size:14px}
.s-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.s-top .kicker{margin:0}
.s-hero{background:var(--fill);color:var(--on-fill);border-radius:24px;padding:34px 34px 30px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.s-hero h1{font-size:56px;letter-spacing:-2px;line-height:1}
.s-hero .cd-meta{font-size:16px;margin-top:12px}
.s-hero .s-count{text-align:right}
.s-hero .s-count .cd-num{font-size:84px}
.s-sec{margin-top:40px}
.s-sec>h2{font-size:26px;letter-spacing:-.6px;margin:0 0 4px}
.s-sec>.s-sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:6px}
.tcard .t-name{font-size:17px;font-weight:800}
.tcard .t-price{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:6px}
.tcard .t-inc{color:var(--muted);font-size:13px}
.tcard .t-av{margin-top:auto;padding-top:16px}
.tcard .track{margin:8px 0 0;height:8px}
.avail{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.avail i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.avail.out{color:var(--muted)}.avail.out i{background:var(--muted)}
.avail.low i{background:var(--warn)}
.isl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:18px}
.isl{background:var(--stat);border-radius:14px;padding:14px 16px}
.isl .isl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.isl .isl-n{font-weight:800;font-size:15px}
.isl .isl-c{color:var(--muted);font-size:12px;line-height:1.35;margin:3px 0 10px;min-height:32px}
.isl .track{height:6px;margin:0}
.isl .isl-v{font-size:13px;font-weight:700;white-space:nowrap}
.bigline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bigline strong{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.bigline span{color:var(--muted);font-size:15px}
.bars{list-style:none;margin:0;padding:0}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:4px 12px;padding:8px 0;font-size:13px}
.bars .b-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .b-v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bars .track{grid-column:1/-1;height:6px;margin:0}
.bars li:has(.pc){grid-template-columns:minmax(0,1fr) 100px}
.prof-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
@media(max-width:850px){.s-hero{grid-template-columns:1fr}.s-hero .s-count{text-align:left}.s-hero h1{font-size:40px}.s-hero .s-count .cd-num{font-size:64px}}
.boothtip .bt-logo{height:72px;margin:-2px 0 12px;padding:10px;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.boothtip .bt-logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.logo-cell{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.logo-th{width:40px;height:40px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#fff;padding:3px;flex:none}
/* editing */
fieldset{border:0;margin:0;padding:0;min-width:0}
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:0 6px 8px}
.tbl td{padding:4px 6px;vertical-align:top}
.tbl td.calc{font-size:13px;color:var(--muted);padding-top:12px;white-space:nowrap}
input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
input[type=number]{text-align:right}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--fill);outline-offset:1px}
label.field{display:block;font-size:12px;font-weight:700;color:var(--muted)}
label.field input,label.field select,label.field textarea{margin-top:5px;font-weight:500}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.btn{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.btn.del{font-size:12px;padding:6px 10px;color:var(--muted);white-space:nowrap}
.btn.del.armed{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.help{font-size:13px;color:var(--muted);margin:0 0 12px}
.guide{font-size:13px;line-height:1.55}
.guide dt{font-weight:700;margin-top:10px}.guide dd{margin:2px 0 0;color:var(--muted)}
.streams{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.stream .fields{grid-template-columns:1fr 1fr}
.stream .top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.stream .top input{font-weight:700;font-size:15px}
.stamp{font-size:12px;color:var(--muted);margin-top:10px}
.banner{margin-top:16px;padding:12px 16px;border-radius:14px;background:var(--soft);font-size:14px}
.banner.err{color:var(--danger)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center}

.muted{color:var(--muted)}

/* ---------- CONNECTD X dark theme for the team view (sign-in, sales and contractor views keep their own look) ---------- */
.rail,.topbar{display:none}
body.x{--bg:#07090F;--card:rgba(20,24,36,.72);--text:#ECEFF7;--muted:rgba(225,230,245,.62);--line:rgba(255,255,255,.09);--soft:rgba(255,255,255,.07);--fill:#fff;--on-fill:#060A1D;--stat:rgba(255,255,255,.04);--input:rgba(255,255,255,.04);--danger:#FF8A9C;--ok:#3DDC97;--warn:#F5B547;--pend-bg:rgba(245,181,71,.1);--pend-fg:#ECEFF7;--hold:rgba(245,181,71,.35);
  --navy:#060A1D;--blue:#3F6AF6;--cyan:#65D0EA;--purple:#A77BFF;--pink:#FF6F91;--amber:#F5B547;--faint:rgba(225,230,245,.4);--line2:rgba(255,255,255,.15);
  background:#07090F;font-family:Inter,Manrope,system-ui,sans-serif;font-size:14px}
body.x::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1000px 520px at 60% 25%,rgba(63,106,246,.16),transparent 65%),radial-gradient(600px 400px at 90% 100%,rgba(101,208,234,.08),transparent 70%),#07090F}
body.x h1,body.x h2,body.x h3,body.x .metric,body.x .progress-title,body.x .tier-sold,body.x .profile-stat strong{font-family:Montserrat,Inter,sans-serif}
body.xt .page{width:auto;margin:0 0 0 64px;padding:0 24px 40px}
body.x .card{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
body.x .fill{background:linear-gradient(90deg,var(--blue),var(--cyan))}
body.x .btn{background:rgba(255,255,255,.04);border-color:var(--line2)}
body.x .btn.primary{background:#fff;color:var(--navy);border-color:#fff}
body.x select option{background:#141927;color:#ECEFF7}
body.x nav.tabs{display:none}
body.x .header{align-items:center;padding:18px 0 4px}
body.x h1{font-size:28px;letter-spacing:-.5px}
body.x .kicker{color:var(--cyan);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px}
body.x .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
body.x .meta>.btn.primary{margin:0!important;order:5}
body.x .meta>div[style]{margin:0!important}
body.x .section{margin-top:18px}
/* icon rail */
body.xt .rail{position:fixed;left:0;top:0;bottom:0;width:64px;z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;border-right:1px solid var(--line);background:rgba(7,9,15,.88)}
.r-mark{width:34px;height:34px;border-radius:50%;margin-bottom:14px;display:grid;place-items:center;font:900 13px Montserrat,sans-serif;color:var(--cyan);background:radial-gradient(circle,var(--navy) 58%,transparent 60%),conic-gradient(from 200deg,var(--blue),var(--cyan),#fff,var(--blue));box-shadow:0 0 16px rgba(63,106,246,.55)}
.r-i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--faint);position:relative;border:0;background:none;cursor:pointer;padding:0}
.r-i:hover{color:var(--text);background:rgba(255,255,255,.05)}
.r-i[aria-current="true"]{background:#fff;color:var(--navy)}
.r-i svg{width:18px;height:18px}
.r-i:hover::after{content:attr(data-tip);position:absolute;left:50px;white-space:nowrap;background:#1A1F2E;border:1px solid var(--line2);padding:5px 9px;border-radius:8px;font:500 12px Inter,sans-serif;color:var(--text);z-index:60}
.r-sp{flex:1}
/* top stat bar */
body.xt .topbar{display:flex;align-items:center;gap:8px;padding:14px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tchip{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:10px;white-space:nowrap;color:var(--muted);font-size:12px;background:rgba(255,255,255,.03)}
.tchip b{color:var(--text);font:700 12.5px Montserrat,sans-serif}
.tchip em{font-style:normal;color:var(--cyan)}
.tchip .muted{font-size:12px}
.t-grow{flex:1;min-width:12px}
.t-user{display:flex;align-items:center;gap:9px;white-space:nowrap}
.t-user .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 10.5px Montserrat,sans-serif;color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan))}
.t-user b{display:block;font-size:12.5px;line-height:1.15}.t-user small{display:block;color:var(--faint);font-size:11px}
/* dashboard: filters */
.hbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 12px}
.hpills{display:flex;gap:4px;padding:4px;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.hpill{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;color:var(--muted);font:500 12.5px Inter,sans-serif;cursor:pointer;border:0;background:none}
.hpill .n{font:700 10.5px Montserrat,sans-serif;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--text)}
.hpill.on{background:#fff;color:var(--navy)}.hpill.on .n{background:var(--navy);color:#fff}
.hpill i{width:8px;height:8px;border-radius:3px}
.htg{margin-left:auto;display:flex;gap:16px;color:var(--muted);font-size:12.5px}
.htg label{display:flex;align-items:center;gap:8px;cursor:pointer}
.htg input{position:absolute;opacity:0;width:1px;height:1px}
.hsw{width:30px;height:17px;border-radius:99px;background:#3A4052;position:relative;transition:.2s}
.hsw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.2s}
.htg input:checked+.hsw{background:var(--blue)}.htg input:checked+.hsw::after{left:15px}
.htg input:focus-visible+.hsw{outline:2px solid var(--cyan);outline-offset:2px}
/* dashboard: 3D hall */
.stage{position:relative;height:620px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(800px 420px at 55% 55%,#141A2C,#0A0D16 70%);perspective:1800px;cursor:grab;touch-action:none;user-select:none}
.stage.dragging{cursor:grabbing}.stage.dragging .hworld{transition:none}
.stage::before{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px}
.hworld{position:absolute;left:56%;top:50%;width:1370px;height:690px;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(var(--tilt)) rotateZ(var(--spin)) scale(var(--zoom));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.hworld *{transform-style:preserve-3d}
.hfloor{position:absolute;inset:0;clip-path:polygon(0.7% 4.3%,98.5% 4.3%,98.5% 99.3%,62.8% 99.3%,62.8% 68.1%,0.7% 68.1%);background:linear-gradient(135deg,#1B2133,#141927)}
.hzone{position:absolute;border:1.5px dashed rgba(255,255,255,.16);border-radius:8px;display:grid;place-items:center;text-align:center;color:var(--faint);font:700 13px Montserrat,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.hzone small{display:block;font:500 11px Inter,sans-serif;text-transform:none;letter-spacing:0}
.hzone.solid{border-style:solid;background:rgba(255,255,255,.03)}
.htitle{position:absolute;font:800 18px Montserrat,sans-serif;color:rgba(255,255,255,.18);letter-spacing:.12em}
.hcarpet{position:absolute;border-radius:6px;background:rgba(255,255,255,.035)}
.hlabel{position:absolute;font:700 12px Montserrat,sans-serif;color:var(--muted);white-space:nowrap;transform:translateY(-100%);padding-bottom:4px}
.hlabel span{font:500 11px Inter,sans-serif;color:var(--faint)}
.hb{position:absolute;cursor:pointer;transform:translateZ(1px)}
/* Floor decorations sit level with the booths, so they must not catch clicks meant for a booth. */
.hfloor,.hzone,.htitle,.hcarpet,.hlabel{pointer-events:none}
.ht{position:absolute;inset:2px;border-radius:5px;background:rgba(255,255,255,.05);border:1.5px dashed rgba(255,255,255,.14);display:grid;place-items:center;font:700 11px Montserrat,sans-serif;color:var(--faint);transition:.2s}
.hb.sec .ht{background:rgba(101,208,234,.2);border:1.5px solid rgba(101,208,234,.65);box-shadow:0 0 22px rgba(101,208,234,.35);color:#CFF3FB}
.hb.hold .ht{background:rgba(245,181,71,.16);border:1.5px solid rgba(245,181,71,.55);color:#FFE2AE}
.hb.org .ht{background:rgba(63,106,246,.24);border:1.5px solid rgba(63,106,246,.7);color:#C7D5FF}
.hb.na .ht{background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 3px,transparent 3px 8px)}
.hb:hover .ht,.hb.sel .ht{background:rgba(255,255,255,.22);border-color:#fff}
.hw{position:absolute;height:44px;transform-origin:0 0;border-radius:3px 3px 0 0;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,#151827,#0B0D16);border:1px solid rgba(255,255,255,.12);border-bottom:0}
.hw::before{content:"";position:absolute;inset:0;opacity:.75;background:linear-gradient(115deg,transparent 30%,rgba(167,123,255,.55) 42%,transparent 50%),linear-gradient(65deg,transparent 52%,rgba(101,208,234,.5) 60%,transparent 68%)}
.hw::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:var(--pillar);box-shadow:0 0 10px var(--pillar)}
.hw.hold{opacity:.8;--pillar:#F5B547!important}
.hw span{position:absolute;left:6px;right:10px;top:50%;transform:translateY(-50%);font:900 10px/1.05 Montserrat,sans-serif;color:#fff;text-align:center;text-shadow:0 0 6px rgba(0,0,0,.8)}
.hled{position:absolute;height:70px;transform-origin:0 0;border-radius:6px 6px 0 0;pointer-events:none;background:radial-gradient(circle at 50% 60%,rgba(167,123,255,.9),rgba(63,106,246,.6) 40%,#0B0D16 75%);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font:900 18px Montserrat,sans-serif;color:#fff;text-shadow:0 0 14px #A77BFF}
.hled i{font-style:normal;color:var(--cyan)}
.hworld.nonames .hw span{display:none}
.hworld.nozones .hzone,.hworld.nozones .htitle{opacity:0}
.hworld.dim .hb:not(.match),.hworld.dim .hw:not(.match){opacity:.15}
/* overlays */
.hpanel{background:rgba(20,24,36,.82);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hfloat{position:absolute;left:16px;top:16px;width:300px;padding:16px;z-index:3;display:flex;flex-direction:column;gap:12px;cursor:default}
.hfloat .ft{display:flex;align-items:flex-start;gap:10px}
.hthumb{width:44px;height:44px;border-radius:10px;flex:none;background:linear-gradient(115deg,#151827 30%,rgba(167,123,255,.8) 45%,#151827 60%),#151827;border:1px solid var(--line2);display:grid;place-items:center;font:900 8px Montserrat,sans-serif;color:#fff;overflow:hidden}
.hthumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.hfloat h3{font:700 15px Montserrat,sans-serif;line-height:1.25;margin:0}
.hbadge{display:inline-block;font:600 10.5px Inter,sans-serif;padding:2px 7px;border-radius:6px;margin-top:5px}
.hbadge.sec{background:rgba(101,208,234,.16);color:var(--cyan)}.hbadge.hold{background:rgba(245,181,71,.16);color:var(--amber)}
.hbadge.av,.hbadge.na{background:rgba(255,255,255,.08);color:var(--muted)}.hbadge.org{background:rgba(63,106,246,.2);color:#A9BEFF}
.hrow{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.hrow b{color:var(--text);font-weight:600;text-align:right}
.hmini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hmini>div{padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.hmini small{display:block;color:var(--faint);font-size:11px}
.hmini b{font:800 15px Montserrat,sans-serif}
.hmeter{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.hmeter i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#FFD98A)}
.hwarn{padding:9px 11px;border-radius:10px;background:rgba(245,181,71,.1);border:1px solid rgba(245,181,71,.25);color:#FFD98A;font-size:12px}
.hcompass{position:absolute;right:18px;top:18px;width:96px;height:96px;border-radius:50%;z-index:3;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#161A28 55%,#0C0E16 56%,#1C2132 70%,#0C0E16 71%);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.hcompass b{font:800 13px Montserrat,sans-serif}
.hcompass small{position:absolute;bottom:14px;left:0;right:0;font-size:9.5px;color:var(--faint)}
.hcompass i{position:absolute;top:8px;left:50%;width:0;height:0;border:6px solid transparent;border-bottom:12px solid var(--pink);transform:translateX(-50%);filter:drop-shadow(0 0 4px var(--pink))}
.htools{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;gap:6px;z-index:3}
.htools button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:rgba(13,16,25,.85);color:var(--muted);font:600 15px Inter,sans-serif;cursor:pointer}
.htools button:hover{color:#fff;border-color:#fff}
.hhint{position:absolute;left:18px;bottom:14px;font-size:11px;color:var(--faint);z-index:3}
.hlegend{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:14px;font-size:11.5px;color:var(--muted);z-index:3;padding:7px 14px;border-radius:99px;white-space:nowrap}
.hlegend span{display:flex;align-items:center;gap:6px}.hlegend i{width:9px;height:9px;border-radius:3px}
/* dashboard: cards below the hall */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.dcard{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.dcard.wide{grid-column:1/-1}
.dch{display:flex;align-items:center;gap:9px}
.dch h3{font:700 14px Montserrat,sans-serif;flex:1;margin:0}
.dch .more{color:var(--faint);font-size:12px}
.isles{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
.isle{padding:18px 8px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.isle small{font-size:12px;color:var(--muted)}
.isle b{font:800 26px/1.1 Montserrat,sans-serif}.isle b em{font-style:normal;color:var(--cyan)}
.isle .lb{font-size:11.5px;color:var(--faint)}
.dtot{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.dtot .tl{display:flex;justify-content:space-between;align-items:baseline}
.dtot h4{font:700 15px Montserrat,sans-serif;margin:0}.dtot .tl b{font:700 13px Montserrat,sans-serif}
.dtot p{font-size:12.5px;color:var(--muted);margin:0}.dtot p b{color:var(--text)}
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-left:3px solid var(--c)}
.al b{font-weight:600;font-size:12.5px;display:block}.al small{color:var(--muted);font-size:11.5px}
.al .tag{margin-left:auto;font:600 10.5px Inter,sans-serif;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--muted);white-space:nowrap}
.mem{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border:0}
.mem .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 10.5px Montserrat,sans-serif;color:#fff;flex:none}
.mem b{display:block;font-weight:600;font-size:12.5px}.mem small{color:var(--faint);font-size:11px}
.mem .v{margin-left:auto;font:700 12px Montserrat,sans-serif}

/* ---------- sales view in the dark theme (the contractor view keeps the light one) ---------- */
body.x .s-hero{background:radial-gradient(700px 300px at 85% 0%,rgba(63,106,246,.45),transparent 60%),radial-gradient(500px 260px at 0% 100%,rgba(101,208,234,.18),transparent 60%),#0B1230;color:var(--text);border:1px solid var(--line2);position:relative;overflow:hidden}
body.x .s-hero h1{font-family:Montserrat,sans-serif;font-weight:900}
body.x .s-hero .cd-meta{color:var(--muted)}
body.x .s-hero .cd-num{color:#fff;text-shadow:0 0 28px rgba(101,208,234,.55);font-family:Montserrat,sans-serif}
body.x .s-hero .cd-unit{color:var(--cyan)}
body.x .s-sec>h2{font-family:Montserrat,sans-serif}
body.x .tcard{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:relative;overflow:hidden}
body.x .tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
body.x .tcard .t-name,body.x .tcard .t-price,body.x .bigline strong{font-family:Montserrat,sans-serif}
body.x .isl{border:1px solid var(--line)}
body.x .s-tabs{border-color:var(--line)}
/* ---------- Commercial and P&L (team view) ---------- */
.ck4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.ck{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ck small{color:var(--muted);font-size:12px}
.ck b{font:800 24px/1.15 Montserrat,sans-serif}.ck b.neg{color:var(--pink)}
.ck b span{font-size:15px;color:var(--faint)}
.ck p{font-size:12px;color:var(--faint);margin:0}.ck p em{font-style:normal;color:var(--text)}

.dpc{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;background:rgba(63,106,246,.12);border:1px solid rgba(63,106,246,.32);font-size:12.5px}
.dpc b{color:#A9BEFF;font-weight:600}
.dpseg{display:flex;gap:6px;flex-wrap:wrap}
.dpseg button{font:600 12.5px Inter,sans-serif;padding:8px 13px;border-radius:99px;border:1px solid var(--line2);background:none;color:var(--muted);cursor:pointer}
.dpseg button[aria-pressed="true"].done{background:var(--ok);border-color:var(--ok);color:#06210F}
.dpseg button[aria-pressed="true"].progress{background:var(--amber);border-color:var(--amber);color:#2A1A00}
.dpseg button[aria-pressed="true"].blocked{background:var(--pink);border-color:var(--pink);color:#2A0010}
.dpf{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.dpa{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.err{color:var(--danger);font-size:12.5px}

.dpr:last-child{border:0}

.mkp[aria-pressed="true"]{background:#fff;color:var(--navy);border-color:#fff}
.mkadd{display:flex;gap:6px;margin-left:auto}.mkadd input{width:200px}
.mksoc td.mkl{font-weight:600;color:var(--text);white-space:nowrap}

.mkmons{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}

.mkm b{font:700 13px Montserrat,sans-serif}.mkm small{font-size:11px;color:var(--faint)}
.mkm[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--navy)}.mkm[aria-pressed="true"] small{color:#4a5270}
.mkhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.mkhead b{font:800 17px Montserrat,sans-serif}.mkhead span{color:var(--muted);font-size:12.5px}
.mkad{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,.02)}
.mkad.open{border-color:var(--line2)}
.mkrow{width:100%;display:grid;grid-template-columns:16px 70px minmax(0,1fr) 48px 96px 120px 90px 70px;gap:10px;align-items:center;padding:11px 14px;background:none;border:0;color:var(--text);font:inherit;font-size:13px;text-align:left;cursor:pointer}

.mkrow .v{text-align:right;font-variant-numeric:tabular-nums}.mkrow small{color:var(--faint);font-size:11.5px;text-align:right}
.mks{font:600 11px Inter,sans-serif;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--muted);justify-self:start}.mks.on{background:rgba(61,220,151,.14);color:var(--ok)}
.mkbody{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.mkfields{display:grid;grid-template-columns:150px minmax(0,1.3fr) minmax(0,1.3fr) 130px 100px;gap:10px;margin-top:10px}
.mklinkbtn{background:none;border:0;color:var(--cyan);font:inherit;font-weight:600;cursor:pointer;padding:0}
.mkov td{font-variant-numeric:tabular-nums}
@media (max-width:760px){.mkadd{margin-left:0;width:100%}.mkadd input{flex:1;width:auto}
  .mkrow{grid-template-columns:16px 60px minmax(0,1fr) 44px;row-gap:4px}.mkrow .v,.mkrow small{grid-column:span 1;text-align:left}.mkrow .v:first-of-type{grid-column:2 / 3}
  .mkfields{grid-template-columns:1fr 1fr}}
.dpfu{display:flex;gap:8px}.dpfu input{flex:1}
.dphist{border-left:2px solid var(--line2);margin-left:4px;padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
.dphist b{color:var(--text);font-weight:600}.dphc{color:#A9BEFF}
.dptw{overflow-x:auto}
.dptab{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.dptab th{text-align:left;font-weight:600;color:var(--faint);font-size:12px;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
.dptab td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line)}.dptab tr:last-child td{border:0}
.dptab .n{text-align:right;font-variant-numeric:tabular-nums;width:90px}.dptab td.bad{color:var(--pink);font-weight:700}
.dpg.blocked{border-color:rgba(255,111,145,.35)}
.dpp{display:grid;grid-template-columns:1fr 1.3fr 1fr .9fr auto;gap:8px;align-items:center}
.dpp.head span{color:var(--faint);font-size:12px;font-weight:600}
.dpp.new{padding-top:10px;border-top:1px solid var(--line)}
.dpe{font-size:12.5px;color:var(--muted);word-break:break-all}
.dpq{display:flex;gap:8px;align-items:center}.dpq input:not([type=checkbox]){flex:1}.dpq select{flex:0 1 180px}
.dpchk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}.dpchk input{width:auto}
@media (max-width:760px){.dpk{grid-template-columns:1fr 1fr}.dpk>div:first-child{grid-column:1/-1}.dpr{grid-template-columns:1fr auto}.dpu{grid-column:1/-1}.dpp{grid-template-columns:1fr 1fr}.dpp.head{display:none}.dpp .dpe{grid-column:1/-1;order:-1}}

@media (max-width:760px){.okan{grid-template-columns:1fr}.mfn{grid-template-columns:90px 1fr 80px}}

  body.xt .rail{display:none}body.xt .page{margin:0;padding:0 12px 28px}

}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="text/plain" id="roi-css">
/* Layout: navy header band, then a sticky assumptions rail on the left and a scrolling results column on the right; stacks on phones. */
:host {
  --bg: #F2F4F8; --surface: #FFFFFF; --surface-2: #EBEFF5; --line: #D9DFE9;
  --ink: #0B1426; --ink-2: #51607C; --navy: #0A1530; --on-navy: #EEF3FF; --on-navy-2: #9FB0D3;
  --accent: #0798B8; --accent-soft: #DDF4F9; --c-inv: #3A4A6B;
  --pos: #16803C; --pos-soft: #E2F4E8; --warn: #B45309; --warn-soft: #FCF0DC; --neg: #C02626; --neg-soft: #FBE6E6;
  --f-display: "Unbounded", "Instrument Sans", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :host {
  --bg: #070C18; --surface: #0E1628; --surface-2: #142038; --line: #23304C;
  --ink: #E5EBF6; --ink-2: #93A2C0; --navy: #040814; --on-navy: #EEF3FF; --on-navy-2: #8D9DC0;
  --accent: #2CD3EE; --accent-soft: #0C2F3B; --c-inv: #6E7FA3;
  --pos: #4ADE80; --pos-soft: #0F2A1B; --warn: #FBBF24; --warn-soft: #2E2308; --neg: #F87171; --neg-soft: #331414;
  color-scheme: dark; } }
*, *::before, *::after { box-sizing: border-box; }
.app { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p, dl, dd, ul, ol { margin: 0; padding: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--ink-2); font-weight: 400; }
.fine { font-size: 12px; color: var(--ink-2); max-width: 72ch; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.hero { background: var(--navy); color: var(--on-navy); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: auto -10% -60% 40%; height: 220%; background: radial-gradient(closest-side, rgba(44,211,238,.16), transparent 70%); pointer-events: none; }
.hero-in { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; padding-block: 28px 26px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .14em; }
.brand span { color: #2CD3EE; margin-left: .35em; }
.hero h1 { font-family: var(--f-display); font-weight: 500; font-size: clamp(22px, 3.2vw, 34px); line-height: 1.15; margin-top: 8px; letter-spacing: -.01em; text-wrap: balance; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; color: var(--on-navy-2); font-size: 13px; }
.hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
.chip-proj { border: 1px solid rgba(238,243,255,.25); border-radius: 999px; padding: 1px 10px; color: var(--on-navy); }
.hero-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.seg { display: inline-flex; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--on-navy-2); padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; }
.seg button.on { background: var(--on-navy); color: #0A1530; }
.btn { display: inline-flex; align-items: center; gap: 7px; border-radius: 9px; padding: 8px 13px; font-size: 13px; font-weight: 600; border: 1px solid transparent; transition: background .15s, border-color .15s; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.ghost { background: transparent; border-color: rgba(238,243,255,.22); color: var(--on-navy); }
.btn.ghost:hover { background: rgba(255,255,255,.08); }
.summary .btn.ghost, .btn.ghost.dark { border-color: var(--line); color: var(--ink); }
.summary .btn.ghost:hover, .btn.ghost.dark:hover { background: var(--surface-2); }
.btn.solid { background: #2CD3EE; color: #04202A; }
.btn.solid:hover { background: #5FE0F3; }

/* main grid */
.main-grid { display: grid; grid-template-columns: 372px minmax(0, 1fr); gap: 24px; padding-block: 24px 48px; align-items: start; }
@media (max-width: 1020px) { .main-grid { grid-template-columns: minmax(0, 1fr); } .hero-actions { align-items: flex-start; } }
.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; scrollbar-width: thin; }
@media (max-width: 1020px) { .panel { position: static; max-height: none; } }
.panel-block { padding: 18px 18px 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.panel-block:last-child { border-bottom: 0; }
.results { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* fields */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field-label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field-box { display: flex; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; transition: border-color .15s, box-shadow .15s; }
.field-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field-box.is-err { border-color: var(--neg); }
.field-box.is-disabled { opacity: .62; }
.field-box input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--ink); font-family: var(--f-mono); font-size: 14px; padding: 8px 0; outline: none; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.field-box input::-webkit-outer-spin-button, .field-box input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field-compact .field-box input { padding: 5px 0; font-size: 13px; }
.affix { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); padding: 0 4px; }
.field-hint { font-size: 11.5px; color: var(--ink-2); }
.field-err { font-size: 11.5px; color: var(--neg); }
.slider-field { display: flex; flex-direction: column; gap: 6px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 99px; background: linear-gradient(to right, var(--accent) var(--p), var(--surface-2) var(--p)); border: 1px solid var(--line); margin: 4px 0; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.2); cursor: grab; }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); cursor: grab; }
.toggle { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle-track { width: 34px; height: 20px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); position: relative; flex-shrink: 0; transition: background .15s; }
.toggle-dot { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink-2); transition: transform .18s, background .15s; }
.toggle input:checked + .toggle-track { background: var(--accent); border-color: var(--accent); }
.toggle input:checked + .toggle-track .toggle-dot { transform: translateX(14px); background: var(--surface); }
.toggle input:focus-visible + .toggle-track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* packages */
.pkg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pkg { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 11px; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, background .15s; }
.pkg:hover { border-color: var(--accent); }
.pkg.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.pkg-name { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.pkg.on .pkg-name { color: var(--ink); }
.pkg-price { font-family: var(--f-mono); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.pkg-booth { font-size: 11.5px; color: var(--ink-2); }
.pkg-custom { grid-column: 1 / -1; }
.total-box { display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; padding: 7px 11px; border-radius: 9px; background: var(--navy); color: var(--on-navy); }
.total-box span { font-size: 11px; color: var(--on-navy-2); font-weight: 600; }
.total-box b { font-family: var(--f-mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.warn { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 9px; padding: 8px 10px; }
.warn svg { flex-shrink: 0; margin-top: 2px; }
.explain { display: flex; gap: 8px; font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 9px; padding: 10px; }
.explain svg { flex-shrink: 0; margin-top: 2px; color: var(--accent); }
.explain b { color: var(--ink); }

/* sections */
.section { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Ids made while a change runs are recorded, so replaying the same change on fresh data creates the same ids.
let idRec = null, idPlay = null;
const uid = () => { if (idPlay && idPlay.length) return idPlay.shift(); const v = Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); if (idRec) idRec.push(v); return v; };

const DEFAULTS = {

  programme: {targets: [], speakers: [], agenda: []},

const KEYS = Object.keys(DEFAULTS);

const loaded = {};

const PARTNER_STATUS = ['Prospect', 'Negotiating', 'Confirmed', 'Dropped'];

const TABS = [['dashboard','Dashboard'],['commercial','Commercial & partnership'],['pnl','P&amp;L'],['programme','Programme & speakers'],['participants','Participant profiling'],['marketing','Marketing performance'],['ops','Operations & workstreams'],['progress','Daily progress'],['admins','Admins'],['settings','Settings']];
let tab = 'dashboard';
// Staff (in Daily progress but not tracker admins) see only that tab, plus Settings when they are a director.
const visTabs = () => TABS.filter(([id]) => isStaff ? id === 'progress' || (id === 'marketing' && dp.me && dp.me.marketer) || (id === 'settings' && dp.me && dp.me.director) : isFinance || id !== 'pnl');
let mode = 'team';
try { if (localStorage.getItem('cdx-mode') === 'sales') mode = 'sales'; } catch (e) {}
if (/sales/i.test(location.hash + location.search)) mode = 'sales';
// The contractor link shows only the booth layout; it never follows the saved team/sales choice.
if (/contractor/i.test(location.hash + location.search)) mode = 'contractor';
// Sales view sections; a link like #sales-roi opens straight on that section.
const STABS = [['packages', 'Packages'], ['roi', 'ROI calculator'], ['booths', 'Booths'], ['audience', 'Audience'], ['programme', 'Programme']];
let stab = 'packages';
try { const v = localStorage.getItem('cdx-stab'); if (STABS.some(([k]) => k === v)) stab = v; } catch (e) {}
{ const m = /sales-(packages|roi|booths|audience|programme)/i.exec(location.hash + location.search); if (m) stab = m[1].toLowerCase(); }
const TEAM_FOOT = 'Internal working tracker. Participant profiling keeps only the summary; uploaded files never leave your browser.';
let db = null, readOnly = false, offline = false;

let upload = null, uploadError = '', indAll = false;

/* ---------- persistence ---------- */
// Each edit is kept as an operation. Before writing, the operations are replayed on the latest saved copy,
// so one person's save never brings back rows another person has just deleted.
const saving = {}, ops = {}, server = {};
const NO_ACCESS_MSG = "Your change wasn't saved: this email can only view the tracker. Ask the owner to add it to the editors list, then reload.";
function setSync(cls, text) { const el = $('#sync'); el.className = 'sync ' + cls; el.querySelector('span').textContent = text; }
function prep(k, d) { if (k === 'programme') ensureDays(d); }
function mut(k, fn) {
  if (readOnly) return;
  if (!state[k]) state[k] = clone(DEFAULTS[k]);
  prep(k, state[k]);
  const tape = []; idRec = tape;
  try { fn(state[k]); } finally { idRec = null; }
  state[k].updatedAt = new Date().toISOString();
  (ops[k] = ops[k] || []).push({fn, tape});
  save(k); requestRender();
}

async function save(k) {
  if (!db || saving[k]) return;
  saving[k] = true; setSync('', 'Saving…');
  try {
    while (ops[k] && ops[k].length) {
      const batch = ops[k].splice(0);
      let fresh;
      try { const snap = await db.doc('tracker/' + k).get(); fresh = withDefaults(k, snap.exists ? snap.data() : null); }
      catch (e) { fresh = withDefaults(k, server[k] || state[k]); }
      prep(k, fresh);
      for (const op of batch) { idPlay = op.tape.slice(); try { op.fn(fresh); } catch (e) {} finally { idPlay = null; } }
      fresh.updatedAt = new Date().toISOString();
      await db.doc('tracker/' + k).set(clone(fresh));
      server[k] = clone(fresh);
      // Keep any edits made while this write was in flight on top of what was just saved.
      const later = ops[k] || [];
      const view = clone(fresh); prep(k, view);
      for (const op of later) { idPlay = op.tape.slice(); try { op.fn(view); } catch (e) {} finally { idPlay = null; } }

  } catch (err) {

    if (code === 'unavailable') { setTimeout(() => save(k), 800 + Math.random() * 800); return; }
    // Undo what was shown on screen, so nothing looks saved when it wasn't.
    ops[k] = [];
    state[k] = server[k] ? clone(server[k]) : state[k];
    if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') { readOnly = true; showBanner(NO_ACCESS_MSG, true); setSync('err', 'View only'); }
    else setSync('err', 'Not saved: ' + (err && err.message || 'unknown error') + '. Your change was undone; try again.');
    requestRender();

}
function showBanner(msg, err) { $('#banner').innerHTML = msg ? `<div class="banner ${err ? 'err' : ''}">${esc(msg)}</div>` : ''; }

/* ---------- render plumbing ---------- */
let rq = false, remotePending = false;
function requestRender() { if (rq) return; rq = true; setTimeout(() => { rq = false; render(); }, 0); }
function editingNow() { if (hall.drag || wsDrag) return true; const a = document.activeElement; return a && (a.id === 'roi-host' || $('#main').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
function remoteRender() { if (editingNow()) { remotePending = true; return; } requestRender(); }
document.addEventListener('focusout', () => setTimeout(() => { if (remotePending && !editingNow()) { remotePending = false; render(); } }, 50));

  const a = document.activeElement; const f = a && a.dataset && a.dataset.b ? a.dataset.b : null;
  if (!visTabs().some(([id]) => id === tab)) tab = isStaff ? 'progress' : 'dashboard';
  $('#tabs').innerHTML = visTabs().map(([id, label]) => `<button class="tab" data-tab="${id}" aria-current="${tab === id}">${label}${id === 'admins' && adminState.requests.length ? ` <span class="pill" style="margin:0 0 0 4px;background:var(--danger);color:#fff">${adminState.requests.length}</span>` : ''}</button>`).join('');
  const times = KEYS.map(k => state[k] && state[k].updatedAt).filter(Boolean).sort();
  const allLoaded = KEYS.every(k => loaded[k]) || offline;
  $('#asof').textContent = isStaff ? '' : !allLoaded ? 'Loading…' : times.length ? 'Last updated ' + fmtDate(times[times.length - 1]) : 'No updates yet';

  renderShell();

  if (mode !== 'team') { if (roiHost) roiHost.remove(); $('#main').innerHTML = VIEWS[mode](); if (mode === 'sales') placeRoi(); return; }

}

function calcCommercial() {
  const c = get('commercial');
  const conf = c.partners.filter(p => p.status === 'Confirmed');
  // Payments are recorded in the P&L (sponsor "Amount paid"); older amounts typed in Commercial still count until overridden there.
  const ov = get('pnl').ov || {}, o = x => ov[x.id] || {};
  const paidOf = x => blankable(o(x).paid) ? num(x.collected) : num(o(x).paid);
  const billedOf = x => blankable(o(x).full) ? num(x.value) * (1 + SST) : num(o(x).full);
  const sales = sum(conf, 'value'), collected = sum(conf, paidOf), billed = sum(conf, billedOf);

}

  Traffic: [['lpViews', 'LP views'], ['reach', 'Reach'], ['impressions', 'Impressions'], ['cpr', 'Cost per result (RM)'], ['spend', 'Ads spent (RM)'], ['tickets', 'Tickets from ads']]
};
const SOCIAL_F = [['posted', 'Content posted'], ['produced', 'Content produced'], ['followers', 'Followers'], ['views', 'Views'], ['viewers', 'Viewers'], ['profileActivity', 'Profile activity'], ['profileVisits', 'Profile visits'], ['linkTaps', 'External link taps'], ['interactions', 'Interactions']];
function calcMarketing() {
  const m = get('marketing'), ads = m.ads || [], reps = ads.flatMap(a => a.reports || []);
  const both = k => sum(reps, k);
  const t = {spend: both('spend'), reach: both('reach'), impressions: both('impressions'), lpViews: both('lpViews'), tickets: both('tickets'), contents: ads.length};
  const r = (a, b, k = 1) => (a && b) ? a / b * k : null;

function mkMonths(m) {

    </tbody></table></div></div>`;

  // Ads report: one month at a time (or the overview), each ad on one row that opens to its report updates

  h += `<div class="card gpanel"><div class="dch"><h3>Ads report</h3><span class="more">${esc(span)} · each report update holds that period's numbers only, so they add up</span></div>

  if (mkMon === 'overview') {
    const rows = months.map(mon => { const rr = monReps(mon), sp = sum(rr, 'spend'), tk = sum(rr, 'tickets'); return {mon, n: monAds(mon).length, sp, reach: sum(rr, 'reach'), imp: sum(rr, 'impressions'), lp: sum(rr, 'lpViews'), tk, cpt: tk ? sp / tk : null}; });
    const T = k => rows.reduce((a, r) => a + r[k], 0), tsp = T('sp'), ttk = T('tk');
    h += `<div class="tbl-wrap"><table class="tbl mkov" style="min-width:820px"><thead><tr><th>Month</th><th>Ads</th><th>Ads spent</th><th>Reach</th><th>Impressions</th><th>LP views</th><th>Tickets from ads</th><th>Cost per ticket</th></tr></thead><tbody>

      <tr class="tot"><td>Total</td><td>${T('n')}</td><td>${f2(tsp)}</td><td>${fmtN(T('reach'))}</td><td>${fmtN(T('imp'))}</td><td>${fmtN(T('lp'))}</td><td>${fmtN(ttk)}</td><td>${ttk ? f2(tsp / ttk) : '–'}</td></tr></tbody></table></div>`;
  } else {
    const inMon = monAds(mkMon), rr = monReps(mkMon);
    h += `<div class="mkhead"><b>${esc(mkMonthName(mkMon))}</b><span>${f2(sum(rr, 'spend'))} spent · ${fmtN(sum(rr, 'tickets'))} tickets · ${fmtN(sum(rr, 'lpViews'))} LP views · ${inMon.length} ${inMon.length === 1 ? 'ad' : 'ads'}</span></div>`;
    ['Engagement', 'Traffic'].forEach(obj => {
      const list = inMon.filter(a => (a.objective || 'Engagement') === obj).sort((a, b) => String(a.date).localeCompare(String(b.date))), F = AD_F[obj];
      h += `<div class="mkobj"><h4>${obj}</h4>`;
      list.forEach(a => {
        const rs = a.reports || [], open = !!mkOpen[a.id], sp = sum(rs, 'spend'), tk = sum(rs, 'tickets');
        const main = obj === 'Traffic' ? `${fmtN(sum(rs, 'lpViews'))} LP views` : `${fmtN(sum(rs, 'views'))} views`;
        h += `<div class="mkad${open ? ' open' : ''}"><button class="mkrow" data-act="mkOpen" data-id="${a.id}" aria-expanded="${open}"><i>${open ? '▾' : '▸'}</i><span class="d">${a.date ? esc(new Date(a.date + 'T12:00').toLocaleDateString('en-MY', {day: 'numeric', month: 'short'})) : 'No date'}</span><b>${esc(a.content || 'Untitled ad')}</b><span class="mks ${a.status === 'On' ? 'on' : ''}">${esc(a.status || 'On')}</span><span class="v">${f2(sp)}</span><span class="v">${main}</span><span class="v">${fmtN(tk)} ${tk === 1 ? 'ticket' : 'tickets'}</span><small>${rs.length} ${rs.length === 1 ? 'update' : 'updates'}</small></button>`;
        if (open) {
          h += `<div class="mkbody"><div class="mkfields"><label class="field">Date<input type="date" data-b="marketing:ads:${a.id}:date" value="${esc(a.date || '')}"></label>

            <label class="field">Objective<select data-b="marketing:ads:${a.id}:objective">${opts(['Engagement', 'Traffic'], obj)}</select></label>
            <label class="field">Status<select data-b="marketing:ads:${a.id}:status">${opts(['On', 'Off'], a.status || 'On')}</select></label></div>
            ${/^https?:\/\//.test(a.link || '') ? `<a class="mkopen" href="${esc(a.link)}" target="_blank" rel="noopener">Open post ↗</a>` : ''}
            <div class="tbl-wrap"><table class="tbl mkads" style="min-width:${180 + F.length * 118}px"><thead><tr><th style="width:150px">Report update</th>${F.map(([, l]) => `<th>${l}</th>`).join('')}<th></th></tr></thead><tbody>
            ${rs.map(r => `<tr><td><input type="date" data-ar="${a.id}|${r.id}|date" value="${esc(r.date || '')}" aria-label="Report date"></td>${F.map(([f, l]) => `<td><input type="number" step="any" inputmode="decimal" data-ar="${a.id}|${r.id}|${f}" value="${mkNum(r[f])}" aria-label="${l}"></td>`).join('')}<td>${del('delRep', a.id + '~' + r.id)}</td></tr>`).join('')}
            </tbody></table></div>${rs.length ? '' : '<div class="empty">No report updates yet.</div>'}
            <div class="row-actions"><button class="btn" data-act="addRep" data-id="${a.id}">＋ Report update</button>${del('delAd', a.id).replace('>Remove<', '>Remove ad<')}</div></div>`;
        }
        h += '</div>';
      });
      h += `${list.length ? '' : `<div class="empty">No ${obj.toLowerCase()} ads in ${esc(mkMonthName(mkMon))}.</div>`}<div class="row-actions"><button class="btn" data-act="addAd" data-id="${mkMon}|${obj}">＋ Add ${obj.toLowerCase()} ad</button></div></div>`;
    });
  }
  h += '</div>';

  return h;
};

/* ---------- PnL ---------- */
const blankable = v => v === '' || v == null;
const SST = 0.08; // added to booth & sponsorship sales only
function calcPnl() {
  const p = get('pnl'), C = calcCommercial(), tiers = Object.fromEntries(C.c.tiers.map(t => [t.id, t.name]));
  // Confirmed partners come straight from Commercial, so a new deal shows up here without retyping.
  // Each confirmed partner is linked to Commercial; anything typed in the PnL overrides that field, blank falls back.
  const OV = p.ov || {}, pick = (o, k, v) => blankable(o[k]) ? v : o[k];
  const linked = C.conf.map(x => {
    const base = {item: (tiers[x.tier] || 'Partner') + (x.boothNo ? ' · booth ' + x.boothNo : ''), party: x.name, full: Math.round(num(x.value) * (1 + SST) * 100) / 100, paid: num(x.collected)};
    base.status = base.paid >= base.full && base.full ? 'Paid' : base.paid ? 'Part paid' : 'Due';
    base.date = ''; base.notes = '';
    const o = OV[x.id] || {};
    const m = {id: 'auto-' + x.id, pid: x.id, kind: 'Income', group: 'Booth & Sponsorship Sales', auto: true, linked: true, base, hidden: !!o.hidden};
    for (const k of ['item', 'party', 'full', 'paid', 'status', 'date', 'notes']) m[k] = pick(o, k, base[k]);
    m.full = num(m.full); m.paid = num(m.paid);
    return m;
  });
  const auto = linked.filter(l => !l.hidden), hiddenCount = linked.length - auto.length;
  const rate = p.commissionPct === '' || p.commissionPct == null ? 10 : num(p.commissionPct);
  // Sponsor amounts include SST; commission is worked out on the amount before SST.
  const sponsor = (sum(auto, 'full') + sum(p.lines.filter(l => l.kind === 'Income' && l.group === 'Booth & Sponsorship Sales'), 'full')) / (1 + SST);
  const comm = {id: 'auto-comm', kind: 'Cost', group: 'Manpower & Commission', item: `Sponsor closing commission (${fmtN(rate)}% of sales before SST)`, party: 'Sponsor closers', full: Math.round(sponsor * rate) / 100, paid: num(p.commPaid), status: 'Estimate', auto: true};
  const all = [...auto, ...p.lines, comm];
  const tot = (kind, group) => { const ls = all.filter(l => l.kind === kind && (!group || l.group === group)); const f = sum(ls, 'full'), pd = sum(ls, 'paid'); return {full: f, paid: pd, bal: sum(ls.filter(l => !blankable(l.full)), l => num(l.full) - num(l.paid))}; };
  const groups = kind => [...new Set([...PNL_GROUPS[kind], ...all.filter(l => l.kind === kind).map(l => l.group)])].filter(g => all.some(l => l.kind === kind && l.group === g));
  const inc = tot('Income'), cost = tot('Cost');
  return {p, auto, hiddenCount, comm, all, tot, groups, inc, cost, rate, net: inc.full - cost.full, cashNet: inc.paid - cost.paid, blanks: p.lines.filter(l => blankable(l.full)).length};
}
// P&L: two grouped lists; click a line to open its fields underneath it.

function pnlEdit(P, l) {

    const n = (f, ph) => `<input type="number" step="any" inputmode="decimal" data-b="${k(f)}" data-num data-blank value="${blankable(o[f]) ? '' : esc(o[f])}" placeholder="${esc(ph)}">`;
    return `<div class="pedit"><p class="help full" style="margin:6px 0 0">Linked to Commercial. Leave a box blank to use the value in grey, or type to override it here only.</p>

  }
  if (l.id === 'auto-comm') return `<div class="pedit"><p class="help full" style="margin:6px 0 0">Worked out from confirmed sponsorship before SST, at the commission rate above.</p><label class="field">Amount paid (RM)${ninp('pnl:commPaid', P.p.commPaid ?? '', 'placeholder="0" data-blank')}</label></div>`;
  if (l.auto) return `<div class="pedit"><p class="help full" style="margin:6px 0 0">Calculated automatically from Commercial. Edit it there.</p></div>`;

    <label class="field">Status<select data-b="pnl:lines:${l.id}:status">${opts(PNL_STATUS, l.status)}</select></label><label class="field">Date / due${inp(`pnl:lines:${l.id}:date`, l.date || '', 'placeholder="Date / due"')}</label>
    <label class="field">Group<select data-b="pnl:lines:${l.id}:group">${opts(PNL_GROUPS[kind], l.group)}</select></label><label class="field">Notes${inp(`pnl:lines:${l.id}:notes`, l.notes || '', 'placeholder="Notes"')}</label>
    <div class="pacts"><span></span>${del('delPnl', l.id)}</div></div>`;
}
function pnlList(P, kind) {
  const r2 = v => fmtRM(Math.round(num(v) * 100) / 100), T = kind === 'Income' ? P.inc : P.cost;
  const lines = P.groups(kind).map(g => {
    const ls = P.all.filter(l => l.kind === kind && l.group === g), t = P.tot(kind, g);
    return `<div class="pgrp">${esc(g)} <b>${r2(t.full)}</b></div>` + ls.map(l => {
      const id = l.linked ? 'auto-' + l.pid : l.id, blank = blankable(l.full), full = num(l.full), paid = num(l.paid);
      const st = l.status || '', open = pnlOpen === id;
      return `<div class="pl ${blank ? 'blank' : ''} ${open ? 'open' : ''}"><div class="pr" data-pl="${esc(id)}" tabindex="0" role="button" aria-expanded="${open}"><div class="pa"><b>${esc(l.item || 'Untitled line')}</b><small>${esc(l.party || '—')}${l.date ? ' · ' + esc(l.date) : ''}</small></div>
        <div class="pz"><b>${blank ? 'Amount TBC' : r2(full)}</b><small>${paid ? r2(paid) + ' paid' : 'nothing paid'}</small></div>
        <div class="pb">${full ? `<div class="track"><div class="fill" style="width:${Math.min(100, pct(paid, full))}%"></div></div>` : '<span style="flex:1"></span>'}<span class="cst ${esc(st.split(' ')[0])}">${esc(st || '–')}</span></div></div>
        ${open ? pnlEdit(P, l) : ''}</div>`;
    }).join('');
  }).join('');
  return `<div class="card plist"><div class="plh"><h3>${kind === 'Income' ? 'Income' : 'Costs'}</h3><small>${P.all.filter(l => l.kind === kind).length} lines</small><b>${r2(T.full)}</b></div>${lines || '<div class="empty" style="padding:14px 18px">No lines yet.</div>'}
    <div class="ptot"><span>Paid so far</span><span>${r2(T.paid)}</span></div>
    <div class="row-actions" style="padding:0 18px 12px;margin-top:0"><button class="btn ${kind === 'Cost' ? 'primary' : ''}" data-act="addPnl" data-id="${kind}">Add ${kind === 'Income' ? 'income' : 'cost'} line</button>${kind === 'Income' && P.hiddenCount ? `<button class="btn" data-act="showHidden">Show ${P.hiddenCount} hidden sponsor line${P.hiddenCount === 1 ? '' : 's'}</button>` : ''}</div></div>`;
}
VIEWS.pnl = () => {
  const P = calcPnl(), r = v => (v < 0 ? '−' : '') + fmtRM(Math.abs(Math.round(v * 100) / 100));
  const mx = Math.max(P.inc.full, P.cost.full) || 1;

      <div class="pvr"><span>Costs</span><div class="pvt"><i class="f" style="width:${P.cost.full / mx * 100}%;background:var(--pink)"></i><i style="width:${P.cost.paid / mx * 100}%;background:var(--pink)"></i></div><b>${r(P.cost.paid)} / ${r(P.cost.full)}</b></div>

async function dpSave(id) {

  dp.err[id] = '';

/* ---------- participant profiling ---------- */
async function handleFile(file) {
  uploadError = '';
  if (!window.XLSX) { uploadError = "The spreadsheet reader didn't load. Reload the page and try again."; render(); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
    upload = {fileName: file.name, wb, sheets: wb.SheetNames, sheet: wb.SheetNames[0]};
    loadSheet();
    if (!upload.rows.length) uploadError = 'That sheet has no rows under its header. Pick another sheet or file.';
  } catch (err) { upload = null; uploadError = "Couldn't read that file. Save it as .xlsx or .csv and try again."; }
  render();
}
// Attendee cells look like "A1: Ali; A2: Siti; A3: Wong" when one registration covers several people.
const TAG_RE = /(?:^|;)\s*A\d+\s*[:.)-]/gi;
const isTagged = v => /(?:^|;)\s*A\d+\s*[:.)-]/i.test(String(v || ''));
function splitTagged(v) {
  const s = clean(v); if (!s) return [];
  if (!isTagged(s)) return [s];
  return s.split(/(?:^|;)\s*A\d+\s*[:.)-]\s*/i).map(x => x.replace(/;\s*$/, '').trim()).filter(Boolean);
}
// Exports can hold orders for several events. The event is the item text before " — " (e.g. "CONNECTDX — General - CNTDX × 2 @ 0.00").
const evOf = v => clean(v).split(/\s+[—–]\s+|\s+×\s*\d/)[0].trim();
const normH = s => clean(s).toLowerCase();
const inEvent = (r, map) => !map.event || !map.items || evOf(r[map.items]) === map.event;
const qtyOf = (r, map) => { const m = map.items && /×\s*(\d+)/.exec(String(r[map.items] || '')); return m ? +m[1] : 0; };
const paxOf = (r, map) => {
  if (map.attendees) { const n = splitTagged(r[map.attendees]).length; if (n) return n; }
  if (map.pax) return num(r[map.pax]) || 1;
  return qtyOf(r, map) || 1;
};
const isVoid = (r, map) => !inEvent(r, map) || map.status && /cancel|refund|fail|void|abandon|pending payment|unpaid|expired/i.test(String(r[map.status] || ''));
function loadSheet() {
  const rows = XLSX.utils.sheet_to_json(upload.wb.Sheets[upload.sheet], {defval: '', raw: false});
  upload.rows = rows; upload.cols = rows.length ? Object.keys(rows[0]).filter(c => !/^__EMPTY/.test(c)) : [];
  const cols = upload.cols;
  const items = cols.find(x => /^items?$/i.test(x.trim())) || cols.find(x => /line items|ticket type|\bproduct/i.test(x)) || '';
  const counts = new Map();
  if (items) rows.forEach(r => { const e = evOf(r[items]); if (e) counts.set(e, (counts.get(e) || 0) + 1); });
  upload.events = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  upload.items = items;
  const pick = upload.events.find(([e]) => /connectd\s*x|cntdx/i.test(e)) || upload.events[0];
  upload.event = upload.events.length > 1 && pick ? pick[0] : '';
  buildMap();
}
function buildMap() {
  const rows = upload.rows, cols = upload.cols, ev = upload.event;
  // With several events in one file, prefer that event's own columns ("CONNECTDX — Industry") over another event's.
  const own = ev ? cols.filter(x => normH(x).startsWith(normH(ev))) : [];
  // Per-event form columns read "Event name — Field"; skip those that belong to a different event.
  const shared = ev ? cols.filter(x => own.includes(x) || !/\s[—–]\s/.test(x)) : cols;
  // Try each pattern in priority order so "Business Location" beats an address "State" column, etc.
  const find = (...res) => { for (const list of [own, shared]) for (const re of res) { const c = list.find(x => re.test(x)); if (c) return c; } return ''; };
  // The attendee column is the one whose cells most often carry "A1:" tags; fall back to a name-like header.
  const scope = rows.filter(r => !ev || !upload.items || evOf(r[upload.items]) === ev);
  const tagged = (own.length ? own : cols).map(c => [c, scope.reduce((n, r) => n + (isTagged(r[c]) ? 1 : 0), 0)]).filter(([c]) => /name|attendee|participant|peserta|nama/i.test(c) && !/company|business/i.test(c)).sort((a, b) => b[1] - a[1]);
  upload.map = {
    attendees: tagged.length && (tagged[0][1] || own.length) ? tagged[0][0] : find(/attendee|participant name|peserta/i),
    company: find(/company name/i, /company|syarikat|organi[sz]ation|business name|brand/i),
    designation: find(/designation/i, /position|jawatan|job title/i, /\btitle\b|\brole\b/i),
    revenue: find(/annual revenue/i, /revenue|turnover|pendapatan|annual sales/i),
    industry: find(/industry|industri/i, /sector|nature of business|business nature|business type/i),
    location: find(/business location/i, /location|lokasi/i, /negeri|\bstate\b/i, /\bcity\b|region|area/i),
    pax: find(/\bpax\b|no\.? of (pax|participants|tickets|attendees)|ticket count|quantity|\bqty\b/i),
    status: find(/order status|payment status|\bstatus\b/i),
    date: find(/order date/i, /paid at|payment date|created/i, /\bdate\b|tarikh|timestamp/i),
    items: upload.items, event: ev

}
const LEADER = /founder|\bceo\b|chief|\bc[eotfmi]o\b|managing director|\bmd\b|director|president|owner|investor|chairman|pengarah|pemilik|c-suite/i;
function revUpper(s) {
  const t = String(s).toLowerCase().replace(/,/g, '');
  const re = /(\d+(?:\.\d+)?)\s*(thousand|k|million|mil|juta|m|billion|bil|b)?(?![a-z])/g;
  let m, vals = [];
  while ((m = re.exec(t))) { let v = parseFloat(m[1]); const u = m[2] || ''; if (/^(k|thousand)$/.test(u)) v *= 1e3; else if (/^(m|mil|million|juta)$/.test(u)) v *= 1e6; else if (/^(b|bil|billion)$/.test(u)) v *= 1e9; vals.push(v); }
  if (!vals.length) return null;
  if (vals.length === 1 && /above|more than|over|exceed|>|\+|lebih|and above/.test(t) && !/below|under|less than|</.test(t)) return Infinity;
  return Math.max(...vals);
}
const clean = v => String(v ?? '').trim().replace(/\s+/g, ' ');
function normLoc(v) {
  let k = clean(v).toLowerCase().replace(/^(w\.?\s?p\.?|wilayah persekutuan|federal territory( of)?)\s*/, '');
  if (/^(kl|k\.l\.?|kuala lumpur)$/.test(k)) return 'Kuala Lumpur';
  return k.replace(/\b\w/g, c => c.toUpperCase());
}
function tally(rows, col, norm = clean, n = 8) {
  if (!col) return [];
  const m = new Map();
  rows.forEach(r => { const raw = clean(r[col]); if (!raw || /^(-|n\/?a|nil|none)$/i.test(raw)) return; const label = norm(raw); const key = label.toLowerCase(); const cur = m.get(key); if (cur) cur[1]++; else m.set(key, [label, 1]); });
  return [...m.values()].sort((a, b) => b[1] - a[1]).slice(0, n);
}
function summarize(allRows, map) {
  const rows = allRows.filter(r => !isVoid(r, map));
  const out = {uploadedAt: new Date().toISOString(), records: rows.length, skipped: allRows.length - rows.length};
  if (map.event) { out.event = map.event; out.otherEvents = allRows.filter(r => !inEvent(r, map)).length; }
  const paxList = rows.map(r => paxOf(r, map));
  out.pax = paxList.reduce((s, n) => s + n, 0);
  out.groupRegs = paxList.filter(n => n > 1).length;
  out.groupMax = paxList.length ? Math.max(...paxList) : 0;
  const sz = [['1 pax', n => n === 1], ['2 pax', n => n === 2], ['3–4 pax', n => n >= 3 && n <= 4], ['5+ pax', n => n >= 5]];
  out.regSizes = sz.map(([l, f]) => [l, paxList.filter(f).length]).filter(([, v]) => v);
  if (map.designation) {
    // One designation per attendee: "A1: CEO; A2: Manager" splits into two people.
    const d = rows.flatMap(r => splitTagged(r[map.designation]));
    const tallyList = (arr, n) => { const m = new Map(); arr.forEach(x => { const k = x.toLowerCase(); const c = m.get(k); if (c) c[1]++; else m.set(k, [x, 1]); }); return [...m.values()].sort((a, b) => b[1] - a[1]).slice(0, n); };
    out.designationCount = d.length;
    out.leadershipPct = d.length ? pct(d.filter(x => LEADER.test(x)).length, d.length) : null;
    out.founders = d.filter(x => /founder/i.test(x)).length;
    out.designations = tallyList(d, 6);
    const S = [['Founder / Co-founder / Owner', /founder|owner|pemilik|proprietor/i], ['CEO / MD / C-suite', /\bceo\b|chief|\bc[eotfmi]o\b|managing director|\bmd\b|president|chairman/i], ['Director / GM / Head', /director|general manager|\bgm\b|\bhead\b|pengarah/i], ['Investor', /investor/i], ['Manager', /manager|pengurus|\blead\b/i]];
    const cnt = Object.fromEntries([...S.map(s => s[0]), 'Executive / Other'].map(k => [k, 0]));
    d.forEach(x => { const m = S.find(s => s[1].test(x)); cnt[m ? m[0] : 'Executive / Other']++; });

  } else { out.leadershipPct = null; out.founders = null; out.designations = []; }
  if (map.revenue) {
    const ups = rows.map(r => revUpper(r[map.revenue])).filter(v => v != null);
    out.revenueLe3Pct = ups.length ? pct(ups.filter(v => v <= 3e6).length, ups.length) : null;
    out.revenueGt3Pct = ups.length ? pct(ups.filter(v => v > 3e6).length, ups.length) : null;

    // same next piece is treated as the first half of one name.
    const cells = rows.map(r => clean(r[map.industry])).filter(v => v && !/^(-|n\/?a|nil|none)$/i.test(v)).map(v => v.split(/\s*,\s*/).filter(Boolean));

  }

function makeDb() {
  const subs = {}, snap = d => ({exists: !!d, data: () => d, metadata: {hasPendingWrites: false}});
  const fail = e => { const m = (e && e.message) || 'unknown error', err = new Error(m); err.code = e.code === '42501' || /row-level security|permission/i.test(m) ? 'not_granted' : /fetch|network/i.test(m) ? 'unavailable' : 'failed'; return err; };

  return {doc: path => { const key = path.split('/')[1]; return {
    async get() {
      // Without finance access: no P&L, and Commercial comes without deal values, collections and target.
      if (!isFinance && key === 'pnl') return snap(null);
      if (!isFinance && key === 'commercial') { const {data, error} = await sb.rpc('commercial_safe'); if (error) throw fail(error); return snap(data); }
      const {data, error} = await sb.from('tracker').select('data').eq('key', key).maybeSingle(); if (error) throw fail(error); return snap(data ? data.data : null);
    },
    async set(v) {
      if (!isFinance && key === 'pnl') throw fail({code: '42501', message: 'permission'});
      // The database puts the stored money figures back in before saving.
      if (!isFinance && key === 'commercial') { const {error} = await sb.rpc('commercial_save_safe', {new_data: v}); if (error) throw fail(error); return; }
      const {error} = await sb.from('tracker').upsert({key, data: v, updated_at: new Date().toISOString()}); if (error) throw fail(error);
    },
    onSnapshot(cb, onErr) {
      (subs[key] = subs[key] || []).push(cb); this.get().then(cb, e => onErr && onErr(e));
      // Live updates can't pass through the filter, so Commercial is re-read every 20 seconds instead.
      if (!isFinance && key === 'commercial') setInterval(() => this.get().then(cb, () => {}), 20000);
    }
  }; }};
}

setInterval(() => { if (gate === 'ready' && (tab === 'dashboard' || mode !== 'team') && !editingNow()) render(); }, 60000);
(async () => {
  if (!window.supabase || /^__/.test(SUPABASE_URL)) { gate = 'ready'; offline = true; render(); setSync('err', 'Not connected'); showBanner('This copy is not connected to the database yet.', true); return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev, session) => { if (session && gate !== 'ready') start(); });
  const {data: {session}} = await sb.auth.getSession();
  if (session) start();
  else if (/contractor/i.test(location.hash)) startContractor();
  else { gate = 'login'; renderGate(); }
})();
</script>
